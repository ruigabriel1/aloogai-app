name: CI

on:
  push:
    branches: [master, main, mvp-funcional]
  pull_request:

jobs:
  backend-testes:
    name: Backend — testes (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: chave-de-ci
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest

  backend-postgis:
    name: Backend — migrações no PostGIS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: aloogai
          POSTGRES_USER: aloogai
          POSTGRES_PASSWORD: aloogai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aloogai" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: chave-de-ci
      DJANGO_SETTINGS_MODULE: config.settings.dev
      USE_SQLITE: "False"
      POSTGRES_DB: aloogai
      POSTGRES_USER: aloogai
      POSTGRES_PASSWORD: aloogai
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - run: pip install -r requirements/dev.txt
      # As mesmas migrações valem para SQLite e PostGIS (ver apps/core/geo_compat.py)
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py check

  mobile:
    name: App — TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
